Global:
  device: gpu
  seed: 2
  epoch_num: 10
  log_smooth_window: 20
  print_batch_step: 20
  output_dir: /root/autodl-tmp/work/ly/exp/C-02_bctr_la/c0_s2
  save_epoch_step:
  - 9
  - 1
  eval_batch_step:
  - 0
  - 1000000000
  eval_epoch_step:
  - 0
  - 1
  cal_metric_during_train: false
  pretrained_model: /root/autodl-tmp/work/OpenOCR-main/output/rec/bctr_scheme51_bs64/svtrv2_tiny_51_gtc_seed48/epoch_100.pth
  checkpoints: null
  use_tensorboard: false
  infer_img: null
  character_dict_path: /root/autodl-tmp/work/OpenOCR-main/tools/utils/ppocr_keys_v1.txt
  max_text_length: 25
  use_space_char: false
  save_res_path: /root/autodl-tmp/work/ly/exp/C-02_bctr_la/c0_s2/predicts.txt
  use_amp: true
  project_name: svtrv2_51_gtc
  distributed: false
  accumulation_steps: 16
Optimizer:
  name: AdamW
  lr: 6.5e-05
  weight_decay: 0.05
  filter_bias_and_bn: true
LRScheduler:
  name: CosineAnnealingLR
  warmup_epoch: 0.3
Architecture:
  model_type: rec
  algorithm: SVTRv2-T-GTC-UCR-5.1
  in_channels: 3
  Transform: null
  Encoder:
    name: SVTRv2LNConvTwo33
    use_pos_embed: false
    dims:
    - 64
    - 128
    - 256
    depths:
    - 3
    - 6
    - 3
    num_heads:
    - 2
    - 4
    - 8
    mixer:
    - - Conv
      - Conv
      - Conv
    - - Conv
      - Conv
      - Conv
      - FGlobal
      - Global
      - Global
    - - Global
      - Global
      - Global
    local_k:
    - - 5
      - 5
    - - 5
      - 5
    - - -1
      - -1
    sub_k:
    - - 1
      - 1
    - - 2
      - 1
    - - -1
      - -1
    last_stage: false
    feat2d: true
  Decoder:
    name: Scheme51Decoder
    infer_gtc: true
    detach: false
    gtc_decoder:
      name: SMTRDecoder
      num_layer: 1
      ds: true
      max_len: 25
      next_mode: true
      sub_str_len: 5
    ctc_decoder:
      name: RCTCDecoder
    character_dict_path: /root/autodl-tmp/work/OpenOCR-main/tools/utils/ppocr_keys_v1.txt
    ucr_enabled: false
    chars_per_image: 2
    ucr_depth: 1
Loss:
  name: Scheme51Loss
  ctc_weight: 0.1
  gtc_weight: 1.0
  gtc_loss:
    name: SMTRLoss
  ucr_weight: 0.0
  alpha_local: 5.0
  alpha_align: 0.0
  alpha_edit: 0.0
  switch_align: 2.0
PostProcess:
  name: CTCLabelDecode
  character_dict_path: /root/autodl-tmp/work/OpenOCR-main/tools/utils/ppocr_keys_v1.txt
  use_space_char: false
Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: true
  is_filter: false
  is_lower: true
Train:
  dataset:
    name: RatioDataSetTVResize
    ds_width: true
    padding: false
    data_dir_list:
    - /root/autodl-tmp/bctr/document/document_train
    - /root/autodl-tmp/bctr/scene/scene_train
    - /root/autodl-tmp/bctr/web/web_train
    transforms:
    - DecodeImagePIL:
        img_mode: RGB
    - PARSeqAugPIL: null
    - GTCLabelEncode:
        gtc_label_encode:
          name: SMTRLabelEncode
          sub_str_len: 5
        character_dict_path: /root/autodl-tmp/work/OpenOCR-main/tools/utils/ppocr_keys_v1.txt
        use_space_char: false
        max_text_length: 25
    - KeepKeys:
        keep_keys:
        - image
        - label
        - label_subs
        - label_next
        - length_subs
        - label_subs_pre
        - label_next_pre
        - length_subs_pre
        - length
        - ctc_label
        - ctc_length
  sampler:
    name: Scheme51RatioSampler
    scales:
    - - 128
      - 32
    first_bs: 64
    fix_bs: false
    divided_factor:
    - 4
    - 16
    is_training: true
    max_ratio: 12
    max_bs: 256
  loader:
    shuffle: true
    batch_size_per_card: 64
    drop_last: true
    min_ratio: 1
    max_ratio: 12
    num_workers: 8
Eval:
  dataset:
    name: RatioDataSetTVResize
    ds_width: true
    padding: false
    data_dir_list:
    - /root/autodl-tmp/bctr/scene/scene_val
    transforms:
    - DecodeImagePIL:
        img_mode: RGB
    - CTCLabelEncode:
        character_dict_path: /root/autodl-tmp/work/OpenOCR-main/tools/utils/ppocr_keys_v1.txt
        use_space_char: false
        max_text_length: 25
    - KeepKeys:
        keep_keys:
        - image
        - label
        - length
  sampler:
    name: Scheme51RatioSampler
    scales:
    - - 128
      - 32
    first_bs: 64
    fix_bs: false
    divided_factor:
    - 4
    - 16
    is_training: false
    max_ratio: 12
    max_bs: 256
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 64
    min_ratio: 1
    max_ratio: 12
    num_workers: 4
Scheme51:
  version: '5.1'
  variant: gtc
  baseline: original SVTRv2-T RCTC + SMTR GTC; no UA/OT/CPPD
  dataset_root: /root/autodl-tmp/bctr
  dictionary_sha256: 28b2362ad4ab2dc38769aa72feb535e3a9ddb3fd2a7585a05920e6393b1dc7f7
  ucr_commit: 320ea5e8f141853f82d146d78a4ad949726b1b48
  extra_resource: author IDS dictionaries; no extra images or pretrained model
  protocol: BCTR-3D local fixed splits; scene_val monitoring; fixed final epoch test;
    CTC only
  sampler: Original ratio policy plus exact-multiple coverage fix for ALL variants
  budget_note: 100 epochs by default; ratio-dependent physical batch; accumulation
    is nominal, not exact global 1024
filename: config
C02:
  tau_train: 0.0
  init_checkpoint: OpenOCR-main/output/rec/bctr_scheme51_bs64/svtrv2_tiny_51_gtc_seed48/epoch_100.pth
  lr_peak: 6.5e-05
  warmup_epoch: 0.3
  epochs: 10
  seed: 2
  prior: OpenOCR-main/output/rec/bctr_scheme51_ab_bs64/train_character_frequency.json
  note: conditional LA, see ly/scripts/c2_finetune.py
